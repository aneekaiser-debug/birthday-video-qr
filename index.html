<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🎉 Birthday Surprise</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  body {
    margin: 0;
    background: black;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    overflow: hidden;
  }

  .screen {
    display: none;
    height: 100vh;
    width: 100vw;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    position: relative;
  }

  .active {
    display: flex;
  }

  h1 {
    margin-bottom: 10px;
  }

  /* ❤️ Glowing Heart */
  .heart {
    font-size: 80px;
    animation: pulse 1.5s infinite;
    color: #ff4d6d;
    text-shadow: 0 0 20px #ff4d6d;
  }

  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }

  /* 👉 Swipe Hint */
  .swipe {
    margin-top: 20px;
    font-size: 18px;
    opacity: 0.8;
    animation: swipeMove 1.5s infinite;
  }

  @keyframes swipeMove {
    0% { transform: translateX(0); }
    50% { transform: translateX(20px); }
    100% { transform: translateX(0); }
  }

  /* ✨ Sparkles */
  .sparkle {
    position: absolute;
    width: 6px;
    height: 6px;
    background: white;
    border-radius: 50%;
    animation: sparkle 3s infinite;
    opacity: 0.8;
  }

  @keyframes sparkle {
    0% { transform: translateY(0) scale(1); opacity: 1; }
    100% { transform: translateY(-120px) scale(0); opacity: 0; }
  }

  video {
    width: 90%;
    max-width: 480px;
    border-radius: 14px;
    margin-top: 20px;
    box-shadow: 0 0 20px rgba(255,255,255,0.3);
  }

  img {
    width: 85%;
    max-width: 320px;
    border-radius: 15px;
    margin-top: 20px;
    box-shadow: 0 0 20px rgba(255,255,255,0.25);
  }
</style>
</head>

<body>

<!-- SCREEN 1: SWIPE -->
<div id="screen1" class="screen active">
  <div class="heart">❤️</div>
  <h1>A Small Surprise</h1>
  <div class="swipe">Swipe to open ✨</div>
</div>

<!-- SCREEN 2: VIDEO -->
<div id="screen2" class="screen">
  <h1>🎂 Happy Birthday!</h1>
  <video id="bdayVideo" controls playsinline>
    <source src="birthday.mp4" type="video/mp4">
  </video>
</div>

<!-- SCREEN 3: PHOTO -->
<div id="screen3" class="screen">
  <h1>💖 Made With Love</h1>
  <img src="photo.jpg" alt="Birthday Photo">
</div>

<script>
  let startX = 0;
  let endX = 0;

  const screen1 = document.getElementById("screen1");
  const screen2 = document.getElementById("screen2");
  const screen3 = document.getElementById("screen3");
  const video = document.getElementById("bdayVideo");

  // Sparkles generator
  function createSparkle() {
    const s = document.createElement("div");
    s.className = "sparkle";
    s.style.left = Math.random() * window.innerWidth + "px";
    s.style.bottom = "0px";
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 3000);
  }

  setInterval(createSparkle, 300);

  // Touch swipe
  document.addEventListener("touchstart", e => startX = e.changedTouches[0].screenX);
  document.addEventListener("touchend", e => {
    endX = e.changedTouches[0].screenX;
    handleSwipe();
  });

  // Mouse swipe
  document.addEventListener("mousedown", e => startX = e.screenX);
  document.addEventListener("mouseup", e => {
    endX = e.screenX;
    handleSwipe();
  });

  function handleSwipe() {
    if (Math.abs(endX - startX) > 50 && screen1.classList.contains("active")) {
      screen1.classList.remove("active");
      screen2.classList.add("active");
    }
  }

  // After video ends → show photo
  video.addEventListener("ended", () => {
    screen2.classList.remove("active");
    screen3.classList.add("active");
  });
</script>

</body>
</html>
